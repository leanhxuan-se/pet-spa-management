        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: ["Lịch hẹn"]
      summary: "Tạo lịch hẹn"
      operationId: CreateBooking
      description: "Dành cho receptionist và manager. Cần đúng cặp khách và thú cưng đang ACTIVE cùng các tùy chọn hợp lệ. Lịch giữ đơn giá hiện hành và bản sao liên hệ của khách."
