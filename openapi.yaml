openapi: "3.0.3"
info:
  title: "Pet Spa API"
  version: "1.0.0"
  description: "API xác thực, khách hàng, thú cưng, danh mục dịch vụ, lịch hẹn và vận hành PetSpa. Gửi các mốc ngày giờ UTC với hậu tố Z. Xem BAO-CAO-DOI-CHIEU-API.md để biết phạm vi các luồng trong sơ đồ."
servers:
  - url: "http://localhost:5052"
    description: "Profile http"
  - url: "https://localhost:7297"
    description: "Profile https"
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: ["Hệ thống"]
      summary: "Kiểm tra API đang hoạt động"
      security: []
      responses:
        "200":
          description: "API đang hoạt động."
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /api/auth/register:
    post:
      tags: ["Auth"]
      summary: "Đăng ký cho hồ sơ khách hàng đã được xác minh"
      operationId: Register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201":
          description: "Đã liên kết tài khoản với hồ sơ khách hàng."
          content:
            application/json:
              schema:
                type: object
                required: [customerId]
                properties:
                  customerId: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { description: "Hồ sơ hoặc số đăng nhập đã có tài khoản." }
        "429": { description: "Quá giới hạn số lần đăng ký." }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/auth/login:
    post:
      tags: ["Auth"]
      summary: "Đăng nhập chung cho khách hàng và nhân viên"
      operationId: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: "Đã đăng nhập."
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { description: "Quá giới hạn số lần đăng nhập." }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/auth/logout:
    post:
      tags: ["Auth"]
      summary: "Đăng xuất trên mọi thiết bị"
      operationId: Logout
      responses:
        "204": { description: "Đã thu hồi các JWT trước đó của tài khoản." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/auth/customers/{customerId}/activation:
    post:
      tags: ["Auth"]
      summary: "Cấp mã kích hoạt cho khách hàng đã xác minh tại quầy"
      operationId: IssueCustomerActivation
      description: "Dành cho receptionist và manager. Dùng mã cùng số điện thoại và mật khẩu để đăng ký qua POST /api/auth/register."
      parameters:
        - { name: customerId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: "Mã kích hoạt có thời hạn 15 phút."
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [activationToken]
                properties:
                  activationToken: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/auth/staff-accounts:
    post:
      tags: ["Auth"]
      summary: "Cấp tài khoản cho hồ sơ nhân viên"
      operationId: CreateStaffAccount
      description: "Dành cho manager và admin theo quyền quản lý vai trò của hồ sơ."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [staffId, password]
              properties:
                staffId: { type: integer, format: int64, minimum: 1 }
                password: { type: string, format: password, minLength: 12, maxLength: 128 }
      responses:
        "201":
          description: "Đã cấp tài khoản."
          content:
            application/json:
              schema:
                type: object
                required: [staffId]
                properties:
                  staffId: { type: integer, format: int64 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Hồ sơ ngừng hoạt động, đã có tài khoản hoặc trùng số đăng nhập." }
        "503": { $ref: "#/components/responses/AuthUnavailable" }
  /api/auth/staff-accounts/{staffId}:
    patch:
      tags: ["Auth"]
      summary: "Đổi mật khẩu, khóa hoặc mở tài khoản nhân viên"
      operationId: UpdateStaffAccount
      description: "Dành cho manager và admin theo quyền quản lý vai trò của hồ sơ. Cần ít nhất một giá trị khác null."
      parameters:
        - { name: staffId, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                password: { type: string, format: password, minLength: 12, maxLength: 128, nullable: true }
                isEnabled: { type: boolean, nullable: true }
      responses:
        "204": { description: "Đã cập nhật và thu hồi JWT cũ của tài khoản." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Trạng thái hiện tại không cho phép thao tác." }
        "503": { $ref: "#/components/responses/AuthUnavailable" }

  /api/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Khách hàng"]
      summary: "Xem hồ sơ khách hàng"
      operationId: GetCustomerById
      description: "Dành cho chủ hồ sơ, receptionist hoặc manager."
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Khách hàng"]
      summary: "Cập nhật hồ sơ khách hàng"
      operationId: UpdateCustomer
      description: "Dành cho chủ hồ sơ, receptionist hoặc manager. Chỉ receptionist và manager được gửi status."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/CustomerConflict" }
        "422": { $ref: "#/components/responses/CustomerValidationFailed" }
  /api/customers:
    get:
      tags: ["Khách hàng"]
      summary: "Liệt kê khách hàng"
      operationId: GetCustomers
      description: "Dành cho receptionist và manager."
      responses:
        "200":
          description: "Danh sách hồ sơ khách hàng."
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: ["Khách hàng"]
      summary: "Tạo hồ sơ khách hàng"
      operationId: CreateCustomer
      description: "Dành cho receptionist và manager. Hồ sơ tạo mới ở trạng thái ACTIVE và điện thoại được chuẩn hóa. Dùng API Auth để cấp mã kích hoạt và đăng ký tài khoản."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/CustomerConflict" }
        "422": { $ref: "#/components/responses/CustomerValidationFailed" }
  /api/customers/{customerId}/pets:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: ["Thú cưng"]
      summary: "Liệt kê thú cưng của khách hàng"
      operationId: GetAllPets
      description: "Dành cho chủ hồ sơ, receptionist hoặc manager. Hồ sơ chưa có thú cưng trả 200 với mảng rỗng."
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: ["Thú cưng"]
      summary: "Tạo hồ sơ thú cưng"
      operationId: CreatePet
      description: "Dành cho receptionist và manager. Chủ phải ACTIVE và customerId trên URL phải khớp customersId trong body. Chỉ receptionist được gửi specialNote, kể cả null."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePetRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/CustomerValidationFailed" }
  /api/pets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Thú cưng"]
      summary: "Xem chi tiết thú cưng"
      operationId: GetPet
      description: "Dành cho chủ thú cưng, receptionist hoặc manager. Khách đọc thú cưng của người khác nhận 404."
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Thú cưng"]
      summary: "Cập nhật hồ sơ thú cưng"
      operationId: UpdatePet
      description: "Dành cho receptionist và manager. Chỉ receptionist được gửi specialNote, kể cả null. Bỏ qua trường này để giữ ghi chú hiện tại."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePetRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/pets/{id}/special-note:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: ["Thú cưng"]
      summary: "Cập nhật ghi chú chăm sóc"
      operationId: UpdatePetSpecialNote
      description: "Dành cho receptionist. Gửi specialNote null để xóa ghi chú."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specialNote]
              properties:
                specialNote: { type: string, nullable: true }
      responses:
        "200":
          description: "Hồ sơ thú cưng sau khi lưu."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/CustomerValidationFailed" }
  /api/categories:
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Liệt kê danh mục"
      operationId: GetCategories
      security: []
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      tags: ["Danh mục dịch vụ"]
      summary: "Tạo danh mục"
      operationId: CreateCategory
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveCategoryRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Xem chi tiết danh mục"
      operationId: GetCategoryById
      security: []
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Danh mục dịch vụ"]
      summary: "Cập nhật danh mục"
      operationId: UpdateCategory
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveCategoryRequest" }
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: ["Danh mục dịch vụ"]
      summary: "Xóa danh mục"
      operationId: DeleteCategory
      description: "Dành cho manager."
      responses:
        "204":
          description: "Đã chuyển sang INACTIVE."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/services:
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Liệt kê dịch vụ"
      operationId: SearchServices
      security: []
      parameters:
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/ActiveOnly"
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: ["Danh mục dịch vụ"]
      summary: "Tạo dịch vụ"
      operationId: CreateService
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveServiceRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/services/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Xem chi tiết dịch vụ"
      operationId: GetServiceById
      security: []
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Danh mục dịch vụ"]
      summary: "Cập nhật dịch vụ"
      operationId: UpdateService
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveServiceRequest" }
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: ["Danh mục dịch vụ"]
      summary: "Xóa dịch vụ"
      operationId: DeleteService
      description: "Dành cho manager."
      responses:
        "204":
          description: "Đã chuyển sang INACTIVE."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/service-options:
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Liệt kê tùy chọn dịch vụ"
      operationId: GetServiceOptions
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceFilter"
        - $ref: "#/components/parameters/ActiveOnly"
        - $ref: "#/components/parameters/OptionSpecies"
        - $ref: "#/components/parameters/OptionWeight"
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: ["Danh mục dịch vụ"]
      summary: "Tạo tùy chọn dịch vụ"
      operationId: CreateServiceOption
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveServiceOptionRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/service-options/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Xem chi tiết tùy chọn dịch vụ"
      operationId: GetServiceOptionById
      security: []
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOption" }
