        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Lịch hẹn"]
      summary: "Cập nhật thông tin lịch hẹn"
      operationId: UpdateBooking
      description: "Dành cho receptionist và manager khi lịch còn PENDING. Trường bỏ qua giữ giá trị hiện tại. Gửi note null để xóa ghi chú."
      requestBody:
        required: true
        content:
          application/json:
