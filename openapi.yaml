openapi: "3.0.3"
info:
  title: "Pet Spa API"
  version: "1.0.0"
  description: "API đăng nhập, quản lý khách hàng, thú cưng, danh mục dịch vụ và lịch hẹn. Thời điểm lịch hẹn dùng UTC với hậu tố Z."
servers:
  - url: "http://localhost:5052"
    description: "Profile http"
  - url: "https://localhost:7297"
    description: "Profile https"
security:
  - bearerAuth: []
paths:
  /health:
    get:
      summary: "Kiểm tra API đang hoạt động"
      security: []
      responses:
        "200":
          description: "API đang hoạt động."
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }
  /api/auth/customer/login:
    post:
      tags: ["Đăng nhập"]
      summary: "Đăng nhập khách hàng"
      operationId: CustomerLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomerLoginRequest" }
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/staff/login:
    post:
      tags: ["Đăng nhập"]
      summary: "Đăng nhập nhân viên"
      operationId: StaffLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Khách hàng"]
      summary: "Xem hồ sơ khách hàng"
      operationId: GetCustomerById
      description: "Dành cho chủ hồ sơ, receptionist hoặc manager."
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Khách hàng"]
      summary: "Cập nhật hồ sơ khách hàng"
      operationId: UpdateCustomer
      description: "Dành cho chủ hồ sơ, receptionist hoặc manager. Chỉ receptionist và manager được gửi status. Bỏ qua password hoặc gửi null để giữ mật khẩu hiện tại."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateCustomerRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /api/customers:
    get:
      tags: ["Khách hàng"]
      summary: "Liệt kê khách hàng"
      operationId: GetCustomers
      description: "Dành cho receptionist và manager."
      responses:
        "200":
          description: "Danh sách hồ sơ khách hàng."
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Customer" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: ["Khách hàng"]
      summary: "Tạo hồ sơ khách hàng"
      operationId: CreateCustomer
      description: "Dành cho receptionist và manager. Hồ sơ tạo mới ở trạng thái ACTIVE. Điện thoại được chuẩn hóa và mật khẩu được băm trước khi lưu."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCustomerRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /api/customers/{customerId}/pets:
    parameters:
      - $ref: "#/components/parameters/CustomerId"
    get:
      tags: ["Thú cưng"]
      summary: "Liệt kê thú cưng của khách hàng"
      operationId: GetAllPets
      description: "Dành cho chủ hồ sơ, receptionist hoặc manager. Hồ sơ chưa có thú cưng trả 200 với mảng rỗng."
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Pet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: ["Thú cưng"]
      summary: "Tạo hồ sơ thú cưng"
      operationId: CreatePet
      description: "Dành cho receptionist và manager. Chủ phải ACTIVE và customerId trên URL phải khớp customersId trong body. Chỉ receptionist được gửi specialNote, kể cả null."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePetRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /api/pets/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Thú cưng"]
      summary: "Xem chi tiết thú cưng"
      operationId: GetPet
      description: "Dành cho chủ thú cưng, receptionist hoặc manager. Khách đọc thú cưng của người khác nhận 404."
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Thú cưng"]
      summary: "Cập nhật hồ sơ thú cưng"
      operationId: UpdatePet
      description: "Dành cho receptionist và manager. Chỉ receptionist được gửi specialNote, kể cả null. Bỏ qua trường này để giữ ghi chú hiện tại."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePetRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/pets/{id}/special-note:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: ["Thú cưng"]
      summary: "Cập nhật ghi chú chăm sóc"
      operationId: UpdatePetSpecialNote
      description: "Dành cho receptionist. Gửi specialNote null để xóa ghi chú."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [specialNote]
              properties:
                specialNote: { type: string, nullable: true }
      responses:
        "200":
          description: "Hồ sơ thú cưng sau khi lưu."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Pet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/BadRequest" }
  /api/categories:
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Liệt kê danh mục"
      operationId: GetCategories
      security: []
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Category" }
    post:
      tags: ["Danh mục dịch vụ"]
      summary: "Tạo danh mục"
      operationId: CreateCategory
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveCategoryRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/categories/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Xem chi tiết danh mục"
      operationId: GetCategoryById
      security: []
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Danh mục dịch vụ"]
      summary: "Cập nhật danh mục"
      operationId: UpdateCategory
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveCategoryRequest" }
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: ["Danh mục dịch vụ"]
      summary: "Xóa danh mục"
      operationId: DeleteCategory
      description: "Dành cho manager."
      responses:
        "204":
          description: "Đã chuyển sang INACTIVE."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/services:
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Liệt kê dịch vụ"
      operationId: SearchServices
      security: []
      parameters:
        - $ref: "#/components/parameters/CategoryFilter"
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/ActiveOnly"
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: ["Danh mục dịch vụ"]
      summary: "Tạo dịch vụ"
      operationId: CreateService
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveServiceRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/services/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Xem chi tiết dịch vụ"
      operationId: GetServiceById
      security: []
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Danh mục dịch vụ"]
      summary: "Cập nhật dịch vụ"
      operationId: UpdateService
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveServiceRequest" }
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Service" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: ["Danh mục dịch vụ"]
      summary: "Xóa dịch vụ"
      operationId: DeleteService
      description: "Dành cho manager."
      responses:
        "204":
          description: "Đã chuyển sang INACTIVE."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/service-options:
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Liệt kê tùy chọn dịch vụ"
      operationId: GetServiceOptions
      security: []
      parameters:
        - $ref: "#/components/parameters/ServiceFilter"
        - $ref: "#/components/parameters/ActiveOnly"
        - $ref: "#/components/parameters/OptionSpecies"
        - $ref: "#/components/parameters/OptionWeight"
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: ["Danh mục dịch vụ"]
      summary: "Tạo tùy chọn dịch vụ"
      operationId: CreateServiceOption
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveServiceOptionRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/service-options/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Xem chi tiết tùy chọn dịch vụ"
      operationId: GetServiceOptionById
      security: []
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOption" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Danh mục dịch vụ"]
      summary: "Cập nhật tùy chọn dịch vụ"
      operationId: UpdateServiceOption
      description: "Dành cho manager."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SaveServiceOptionRequest" }
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: ["Danh mục dịch vụ"]
      summary: "Xóa tùy chọn dịch vụ"
      operationId: DeleteServiceOption
      description: "Dành cho manager."
      responses:
        "204":
          description: "Đã chuyển sang INACTIVE."
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/categories/{categoryId}/services:
    parameters:
      - $ref: "#/components/parameters/CategoryId"
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Liệt kê dịch vụ theo danh mục"
      operationId: GetServicesByCategory
      security: []
      parameters:
        - $ref: "#/components/parameters/Keyword"
        - $ref: "#/components/parameters/ActiveOnly"
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Service" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/services/{serviceId}/options:
    parameters:
      - $ref: "#/components/parameters/ServiceId"
    get:
      tags: ["Danh mục dịch vụ"]
      summary: "Liệt kê tùy chọn theo dịch vụ"
      operationId: GetOptionsByService
      security: []
      parameters:
        - $ref: "#/components/parameters/ActiveOnly"
        - $ref: "#/components/parameters/OptionSpecies"
        - $ref: "#/components/parameters/OptionWeight"
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ServiceOption" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/bookings:
    get:
      tags: ["Lịch hẹn"]
      summary: "Tìm kiếm và phân trang lịch hẹn"
      operationId: ListBookings
      description: "Dành cho receptionist và manager. Sắp theo COMPLETED, CONFIRMED, PAID, PENDING, CANCELLED, rồi theo giờ hẹn tăng dần (trống cuối) và ID tăng dần."
      parameters:
        - { name: date, in: query, description: "Ngày UTC.", schema: { type: string, format: date } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/BookingStatus" } }
        - { name: customerId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: contactPhone, in: query, schema: { type: string } }
        - { name: cursor, in: query, description: "Giá trị nextCursor của trang trước.", schema: { type: string } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: "Trang kết quả, kể cả khi items rỗng."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: ["Lịch hẹn"]
      summary: "Tạo lịch hẹn"
      operationId: CreateBooking
      description: "Dành cho receptionist và manager. Cần đúng cặp khách và thú cưng đang ACTIVE cùng các tùy chọn hợp lệ. Lịch giữ đơn giá hiện hành và bản sao liên hệ của khách."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: "Trả về đối tượng sau khi lưu."
          headers:
            Location:
              description: "Đường dẫn chi tiết của đối tượng."
              schema:
                type: string
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/bookings/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Lịch hẹn"]
      summary: "Xem lịch hẹn"
      operationId: GetBookingById
      description: "Dành cho receptionist, manager hoặc khách sở hữu lịch."
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: ["Lịch hẹn"]
      summary: "Cập nhật thông tin lịch hẹn"
      operationId: UpdateBooking
      description: "Dành cho receptionist và manager khi lịch còn PENDING. Trường bỏ qua giữ giá trị hiện tại. Gửi note null để xóa ghi chú."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateBookingRequest" }
            example: { bookingTime: "2026-11-20T03:00:00Z", contactName: "Nguyễn An", contactPhone: "0900000001", note: "Đón tại quầy" }
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
    delete:
      tags: ["Lịch hẹn"]
      summary: "Hủy lịch hẹn"
      operationId: CancelBooking
      description: "Dành cho receptionist và manager. Hủy lịch trước bàn giao hoặc khi mọi dòng đã bàn giao đều được hủy. Gọi lại trả 204 và giữ mốc hủy đã lưu."
      responses:
        "204": { description: "Lịch đã hủy." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/bookings/{id}/services:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: ["Lịch hẹn"]
      summary: "Thay toàn bộ tùy chọn dịch vụ của lịch hẹn"
      operationId: ReplaceBookingServices
      description: "Dành cho receptionist và manager trước khi bàn giao lịch PENDING hoặc CONFIRMED. Giữ ID và giá đã chốt cho các dòng còn lại."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceBookingServicesRequest" }
      responses:
        "200":
          description: "Thành công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/booking/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: ["Lịch hẹn"]
      summary: "Tiếp nhận hoặc chốt lịch hẹn"
      operationId: ChangeBookingStatus
      description: "Dành cho receptionist và manager. confirmed tiếp nhận lịch đủ điều kiện. completed chốt lịch đã bàn giao khi tất cả dòng kết thúc và có ít nhất một dòng COMPLETED. Gọi lại khi đã ở trạng thái đích trả kết quả đã lưu."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangeBookingStatusRequest" }
            examples:
              confirm: { value: { status: confirmed } }
              complete: { value: { status: completed } }
      responses:
        "200":
          description: "Lịch sau khi tiếp nhận hoặc chốt."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    ActiveOnly:
      name: activeOnly
      in: query
      description: "Khi true, chỉ trả dữ liệu ACTIVE cùng các cấp cha ACTIVE."
      schema: { type: boolean, default: false }
    OptionSpecies:
      name: species
      in: query
      schema: { $ref: "#/components/schemas/Species" }
    OptionWeight:
      name: weight
      in: query
      description: "Cân nặng theo kg, gồm cả hai biên của khoảng."
      schema: { type: number, minimum: 0 }
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CategoryFilter:
      name: categoryId
      in: query
      schema:
        type: integer
        format: int64
    ServiceFilter:
      name: serviceId
      in: query
      schema:
        type: integer
        format: int64
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
  responses:
    BadRequest:
      description: "Request không hợp lệ. Lỗi binding có thể có body rỗng."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
        application/json:
          schema:
            type: object
            additionalProperties: true
    Unauthorized:
      description: "Thiếu token hợp lệ hoặc thông tin đăng nhập không được chấp nhận."
    Forbidden:
      description: "Token hợp lệ về xác thực nhưng claim tài khoản không đạt yêu cầu hoặc tài khoản thiếu quyền."
    NotFound:
      description: "Không tìm thấy đối tượng."
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Conflict:
      description: "Dữ liệu xung đột hoặc trạng thái hiện tại không cho phép thao tác."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
  schemas:
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, minLength: 1, maxLength: 20, example: "0900000001" }
        password: { type: string, format: password, minLength: 1, example: example-password }
    CustomerLoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, minLength: 1, maxLength: 30, example: "+84900000001" }
        password: { type: string, format: password, minLength: 1, example: example-password }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAtUtc, role, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresAtUtc: { type: string, format: date-time }
        role: { type: string, enum: [customer, staff, receptionist, manager, admin] }
        user: { $ref: "#/components/schemas/LoginUser" }
    LoginUser:
      type: object
      required: [id, fullName, phone]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        phone: { type: string }
    CreateCustomerRequest:
      type: object
      required: [fullName, phone, password]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        email: { type: string, format: email, maxLength: 255, nullable: true }
        phone: { type: string, pattern: '^(0|\+84)[35789][0-9]{8}$', example: "0900000001" }
        password: { type: string, format: password, minLength: 1, writeOnly: true }
        status: { type: string, enum: [ACTIVE], default: ACTIVE }
    UpdateCustomerRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150, nullable: true }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        email: { type: string, format: email, maxLength: 255, description: "Gửi null hoặc chuỗi rỗng để xóa email.", nullable: true }
        phone: { type: string, pattern: '^(0|\+84)[35789][0-9]{8}$', example: "0900000001", nullable: true }
        password: { type: string, format: password, minLength: 1, writeOnly: true, nullable: true }
        avtURL: { type: string, maxLength: 2048, nullable: true }
        note: { type: string, maxLength: 1024, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE, null], nullable: true }
    Customer:
      type: object
      required: [id, fullName, gender, dateOfBirth, email, phone, avtURL, note, pets, status]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string, minLength: 1, maxLength: 150 }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        email: { type: string, format: email, maxLength: 255, nullable: true }
        phone: { type: string, minLength: 1, maxLength: 30, example: "0900000001" }
        avtURL: { type: string, nullable: true }
        note: { type: string, nullable: true }
        pets: { type: array, items: { $ref: "#/components/schemas/Pet" }, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CreatePetRequest:
      type: object
      required: [customersId, name, species]
      properties:
        customersId: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        species: { $ref: "#/components/schemas/Species" }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        weight: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 9999.99, nullable: true }
        height: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 9999.99, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        specialNote: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
    UpdatePetRequest:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 100, nullable: true }
        species: { type: string, enum: [DOG, CAT, CHICKEN, FISH, OTHER, null], nullable: true }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        weight: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 9999.99, nullable: true }
        height: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 9999.99, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        specialNote: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE, null], nullable: true }
    Pet:
      type: object
      required: [id, customersId, name, species, gender, weight, height, dateOfBirth, specialNote, status]
      properties:
        id: { type: integer, format: int64 }
        customersId: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        species: { $ref: "#/components/schemas/Species" }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        weight: { type: number, nullable: true }
        height: { type: number, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        specialNote: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    Species: { type: string, enum: [DOG, CAT, CHICKEN, FISH, OTHER] }
    WritableResourceStatus: { type: string, enum: [ACTIVE, MAINTAINED, INACTIVE], default: ACTIVE }
    ResourceStatus: { type: string, enum: [ACTIVE, MAINTAINED, INACTIVE, DELETED] }
    SaveCategoryRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/WritableResourceStatus" }
    Category:
      type: object
      required: [id, name, description, status]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string, minLength: 1, maxLength: 50 }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ResourceStatus" }
    SaveServiceRequest:
      type: object
      required: [categoryId, serviceName]
      properties:
        categoryId: { type: integer, format: int64, minimum: 1 }
        serviceName: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/WritableResourceStatus" }
    Service:
      type: object
      required: [id, categoryId, serviceName, description, status]
      properties:
        id: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64, minimum: 1 }
        serviceName: { type: string, minLength: 1, maxLength: 256 }
        description: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/ResourceStatus" }
    SaveServiceOptionRequest:
      type: object
      required: [serviceId, species, durationMinutes, unitPrice]
      properties:
        serviceId: { type: integer, format: int64, minimum: 1 }
        species: { $ref: "#/components/schemas/Species" }
        minWeight: { type: number, minimum: 0, nullable: true }
        maxWeight: { type: number, minimum: 0, nullable: true }
        durationMinutes: { type: integer, format: int32, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        status: { $ref: "#/components/schemas/WritableResourceStatus" }
    ServiceOption:
      type: object
      required: [id, serviceId, species, minWeight, maxWeight, durationMinutes, unitPrice, status]
      properties:
        id: { type: integer, format: int64 }
        serviceId: { type: integer, format: int64, minimum: 1 }
        species: { $ref: "#/components/schemas/Species" }
        minWeight: { type: number, minimum: 0, nullable: true }
        maxWeight: { type: number, minimum: 0, nullable: true }
        durationMinutes: { type: integer, format: int32, minimum: 1 }
        unitPrice: { type: number, minimum: 0 }
        status: { $ref: "#/components/schemas/ResourceStatus" }
    CreateBookingRequest:
      type: object
      additionalProperties: false
      required: [customerId, petId, bookingTime, serviceOptionIds]
      properties:
        customerId: { type: integer, format: int64, minimum: 1 }
        petId: { type: integer, format: int64, minimum: 1 }
        bookingTime: { type: string, format: date-time, example: "2026-11-20T03:00:00Z" }
        note: { type: string, nullable: true }
        serviceOptionIds: { type: array, items: { type: integer, format: int64, minimum: 1 }, minItems: 1, uniqueItems: true, example: [100, 200] }
    UpdateBookingRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        bookingTime: { type: string, format: date-time, example: "2026-11-20T03:00:00Z" }
        contactName: { type: string, minLength: 1, maxLength: 150 }
        contactPhone: { type: string, pattern: '^\+?[0-9]{7,15}$', example: "0900000001" }
        note: { type: string, nullable: true }
    ChangeBookingStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [confirmed, completed] }
    ReplaceBookingServicesRequest:
      type: object
      additionalProperties: false
      required: [serviceOptionIds]
      properties:
        serviceOptionIds: { type: array, items: { type: integer, format: int64, minimum: 1 }, minItems: 1, uniqueItems: true, example: [100, 200] }
    Booking:
      type: object
      required: [id, customerId, petId, bookingTime, note, status, checkIn, checkOut, createdAt, updatedAt, services, contactName, contactPhone, sessionsCreatedAt, cancelledAt]
      properties:
        id: { type: integer, format: int64 }
        customerId: { type: integer, format: int64, minimum: 1 }
        petId: { type: integer, format: int64, minimum: 1 }
        bookingTime: { type: string, format: date-time, nullable: true, example: "2026-11-20T03:00:00Z" }
        note: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/BookingStatus" }
        checkIn: { type: string, format: date-time, nullable: true }
        checkOut: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        services: { type: array, items: { $ref: "#/components/schemas/BookingDetail" } }
        contactName: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        sessionsCreatedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
    BookingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Booking" } }
        nextCursor: { type: string, nullable: true }
    BookingStatus: { type: string, enum: [PENDING, CONFIRMED, COMPLETED, PAID, CANCELLED] }
    BookingDetail:
      type: object
      required: [id, serviceOptionId, unitPrice, status]
      properties:
        id: { type: integer, format: int64 }
        serviceOptionId: { type: integer, format: int64 }
        unitPrice: { type: number }
        status: { type: string, enum: [ASSIGNED, WORKING, COMPLETED, CANCELLED] }
    Message:
      type: object
      properties:
        message: { type: string }
    ValidationProblem:
      type: object
      required: [errors]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer, format: int32 }
        errors: { type: object, additionalProperties: { type: array, items: { type: string } } }
