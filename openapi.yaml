        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
  /api/service-sessions:
    post:
      tags: ["Phiên dịch vụ"]
      summary: "Bàn giao lịch và tạo nhóm phiên"
      operationId: CreateServiceSessionGroup
      description: "Dành cho receptionist, manager và admin. Cần lịch CONFIRMED và bố trí đủ các dòng còn hiệu lực. Gọi lại với cùng lịch và đúng tập dòng đã bàn giao trả nhóm hiện tại. Dùng PUT phiên để thay đổi bố trí."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateServiceSessionGroupRequest" }
      responses:
        "200":
          description: "Nhóm đã bàn giao."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSessionGroup" }
        "201":
          description: "Đã tạo nhóm phiên WAITING và ghi mốc bàn giao."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceSessionGroup" }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
  /api/service-sessions/current:
    get:
      tags: ["Phiên dịch vụ"]
      summary: "Theo dõi các nhóm phiên theo lịch"
      operationId: GetCurrentServiceSessionGroups
      description: "Dành cho receptionist, manager và admin. Tải mọi phiên của các lịch đã bàn giao đang CONFIRMED hoặc COMPLETED chưa có hóa đơn hiệu lực. Gửi nextAfterBookingId vào afterBookingId để đọc trang tiếp theo."
      parameters:
        - { name: afterBookingId, in: query, schema: { type: integer, format: int64, minimum: 1 } }
        - { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: "Trang nhóm phiên tính theo bookingId tăng dần."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CurrentServiceSessionPage" }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
  /api/service-sessions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: ["Phiên dịch vụ"]
      summary: "Xem chi tiết phiên dịch vụ"
      operationId: GetServiceSessionById
      description: "Dành cho receptionist, manager, admin hoặc nhân viên có phân công còn hiệu lực trên phiên."
      responses:
        "200": { $ref: "#/components/responses/ServiceSessionDetails" }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
    put:
      tags: ["Phiên dịch vụ"]
      summary: "Đổi phòng và khung giờ dự kiến"
      operationId: UpdateServiceSession
      description: "Dành cho receptionist, manager và admin. Chỉ sửa phiên WAITING. Phòng và các nhân viên đang được phân công phải phù hợp với khung giờ mới."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateServiceSessionRequest" }
      responses:
        "200": { $ref: "#/components/responses/ServiceSessionDetails" }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
    delete:
      tags: ["Phiên dịch vụ"]
      summary: "Hủy phiên dịch vụ"
      operationId: CancelServiceSession
      description: "Dành cho receptionist, manager và admin. Hủy phiên WAITING, thu hồi phân công và đặt dòng dịch vụ thành CANCELLED trong cùng giao dịch. Gọi lại cho phiên đã hủy trả 204."
      responses:
        "204": { description: "Phiên đã hủy." }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
  /api/service-sessions/{id}/start:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: ["Phiên dịch vụ"]
      summary: "Bắt đầu phiên dịch vụ"
      operationId: StartServiceSession
      description: "Dành cho nhân viên có phân công còn hiệu lực. Chuyển phiên WAITING có phòng khả dụng sang IN_PROGRESS, ghi mốc bắt đầu và đồng bộ dòng dịch vụ sang WORKING trong cùng giao dịch. Gọi lại khi đang IN_PROGRESS trả phiên hiện tại."
      responses:
        "200": { $ref: "#/components/responses/ServiceSessionDetails" }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
  /api/service-sessions/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: ["Phiên dịch vụ"]
      summary: "Hoàn tất phiên dịch vụ"
      operationId: CompleteServiceSession
      description: "Dành cho nhân viên có phân công còn hiệu lực. Hoàn tất phiên IN_PROGRESS và dòng dịch vụ trong cùng giao dịch. Gọi lại giữ nguyên finishedAt."
      responses:
        "200": { $ref: "#/components/responses/ServiceSessionDetails" }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
  /api/service-sessions/{id}/assignments:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: ["Phân công"]
      summary: "Phân công nhân viên"
      operationId: AssignStaffToSession
      description: "Dành cho receptionist, manager và admin. Tạo phân công cho phiên WAITING và gửi thông báo ASSIGNED. Nếu nhân viên đã có phân công còn hiệu lực trên phiên, trả phân công hiện tại."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignStaffRequest" }
      responses:
        "200": { $ref: "#/components/responses/StaffAssignmentDetails" }
        "201":
          description: "Phân công và thông báo đã tạo."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAssignment" }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
  /api/service-sessions/{id}/assignments/{assignmentId}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/AssignmentId"
    put:
      tags: ["Phân công"]
      summary: "Đổi nhân viên phụ trách"
      operationId: ReassignStaffOnSession
      description: "Dành cho receptionist, manager và admin. Trên phiên WAITING, lưu lịch sử phân công cũ và gửi thông báo REASSIGNED cho nhân viên mới. Gửi lại cùng nhân viên trên phân công còn hiệu lực trả phân công hiện tại."
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssignStaffRequest" }
      responses:
        "200": { $ref: "#/components/responses/StaffAssignmentDetails" }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
    delete:
      tags: ["Phân công"]
      summary: "Thu hồi phân công"
      operationId: RevokeStaffAssignment
      description: "Dành cho receptionist, manager và admin. Thu hồi phân công còn hiệu lực trên phiên WAITING. Gọi lại với phân công đã thu hồi trả 204."
      responses:
        "204": { description: "Phân công đã thu hồi." }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
  /api/service-sessions/{id}/notifications:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: ["Thông báo"]
      summary: "Gửi thông báo nhắc việc"
      operationId: SendAssignmentReminder
      description: "Dành cho receptionist, manager, admin hoặc nhân viên có phân công còn hiệu lực trên phiên WAITING. Chọn phân công còn hiệu lực để gửi nhắc việc."
      parameters:
        - name: Idempotency-Key
          in: header
          description: "Khóa tùy chọn cho một lần nhắc. Khi thử lại với cùng khóa và cùng phân công còn hiệu lực, API trả thông báo đã tạo."
          schema: { type: string, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RemindAssignmentRequest" }
      responses:
        "200":
          description: "Thông báo đã tạo trước đó với cùng khóa và phân công."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffNotification" }
        "201":
          description: "Thông báo nhắc việc đã tạo."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffNotification" }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
        "409": { $ref: "#/components/responses/OperationConflict" }
  /api/me/service-sessions:
    get:
      tags: ["Công việc cá nhân"]
      summary: "Xem phiên dịch vụ được giao"
      operationId: GetMyServiceSessions
      description: "Lấy các phiên có phân công còn hiệu lực theo staff_id của tài khoản đang đăng nhập."
      responses:
        "200":
          description: "Danh sách phiên được giao."
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/MyServiceSession" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
  /api/me/notifications:
    get:
      tags: ["Thông báo"]
      summary: "Xem thông báo của tôi"
      operationId: GetMyNotifications
      description: "Lấy thông báo và số chưa đọc theo staff_id của tài khoản đang đăng nhập."
      responses:
        "200":
          description: "Thông báo của tài khoản đang đăng nhập."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyNotificationList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
  /api/me/notifications/{id}/read:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags: ["Thông báo"]
      summary: "Đánh dấu thông báo đã đọc"
      operationId: MarkMyNotificationAsRead
      description: "Chỉ người nhận được đánh dấu thông báo của mình. Gọi lại khi thông báo đã đọc giữ mốc đọc đã lưu."
      responses:
        "204": { description: "Thông báo đã đọc." }
        "400": { $ref: "#/components/responses/OperationBadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/OperationForbidden" }
        "404": { $ref: "#/components/responses/OperationNotFound" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    RoomStartTime:
      name: startTime
      in: query
      description: "Mốc bắt đầu. Gửi cùng endTime hoặc bỏ cả hai mốc."
      schema: { type: string, format: date-time }
    RoomEndTime:
      name: endTime
      in: query
      description: "Mốc kết thúc, phải sau startTime."
      schema: { type: string, format: date-time }
    ActiveOnly:
      name: activeOnly
      in: query
      description: "Khi true, chỉ trả dữ liệu ACTIVE cùng các cấp cha ACTIVE."
      schema: { type: boolean, default: false }
    OptionSpecies:
      name: species
      in: query
      schema: { $ref: "#/components/schemas/Species" }
    OptionWeight:
      name: weight
      in: query
      description: "Cân nặng theo kg, gồm cả hai biên của khoảng."
      schema: { type: number, minimum: 0 }
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CustomerId:
      name: customerId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PetId:
      name: petId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CategoryFilter:
      name: categoryId
      in: query
      schema:
        type: integer
        format: int64
    ServiceFilter:
      name: serviceId
      in: query
      schema:
        type: integer
        format: int64
    Keyword:
      name: keyword
      in: query
      schema:
        type: string
  responses:
    BadRequest:
      description: "Request không hợp lệ. Lỗi binding có thể có body rỗng."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
        application/json:
          schema:
            type: object
            additionalProperties: true
    Unauthorized:
      description: "Thiếu token hợp lệ hoặc thông tin đăng nhập không được chấp nhận."
    AuthUnavailable:
      description: "Dịch vụ xác thực tạm thời không truy cập được cơ sở dữ liệu."
    CustomerValidationFailed:
      description: "Dữ liệu không hợp lệ theo trường."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldErrors" }
    CustomerConflict:
      description: "Trùng số điện thoại hoặc email."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldErrors" }
    Forbidden:
      description: "Token hợp lệ về xác thực nhưng claim tài khoản không đạt yêu cầu hoặc tài khoản thiếu quyền."
    NotFound:
      description: "Không tìm thấy đối tượng."
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Conflict:
      description: "Dữ liệu xung đột hoặc trạng thái hiện tại không cho phép thao tác."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    OperationBadRequest:
      description: "Yêu cầu không hợp lệ. Lỗi đọc tham số hoặc JSON có thể trả body rỗng."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ValidationProblem" }
        application/json:
          schema: { $ref: "#/components/schemas/FieldErrors" }
    OperationForbidden:
      description: "Tài khoản không đủ quyền. Từ chối ở tầng phân quyền có thể trả body rỗng."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldErrors" }
    OperationNotFound:
      description: "Không tìm thấy dữ liệu phù hợp."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldErrors" }
    OperationConflict:
      description: "Dữ liệu xung đột hoặc trạng thái hiện tại không cho phép thao tác."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/FieldErrors" }
    RoomList:
      description: "Danh sách phòng. Có thể rỗng."
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/Room" }
    StaffList:
      description: "Danh sách nhân viên."
      content:
        application/json:
          schema:
            type: array
            items: { $ref: "#/components/schemas/Staff" }
    StaffDetails:
      description: "Hồ sơ nhân viên."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Staff" }
    StaffShiftDetails:
      description: "Thông tin ca làm."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StaffShift" }
    ServiceSessionDetails:
      description: "Chi tiết phiên dịch vụ."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ServiceSession" }
    StaffAssignmentDetails:
      description: "Thông tin phân công."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/StaffAssignment" }
  schemas:
    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone: { type: string, minLength: 1, maxLength: 30, example: "0900000001" }
        password: { type: string, format: password, minLength: 1, maxLength: 4096, example: example-password }
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [phone, password, activationToken]
      properties:
        phone: { type: string, maxLength: 30, example: "+84900000001" }
        password: { type: string, format: password, minLength: 12, maxLength: 128 }
        activationToken: { type: string, minLength: 1, maxLength: 1024, writeOnly: true }

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresAtUtc, role, user]
      properties:
        accessToken: { type: string }
        tokenType: { type: string, enum: [Bearer] }
        expiresAtUtc: { type: string, format: date-time }
        role: { type: string, enum: [customer, staff, receptionist, manager, admin] }
        user: { $ref: "#/components/schemas/LoginUser" }
    LoginUser:
      type: object
      required: [id, fullName, phone]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string }
        phone: { type: string }
    CreateCustomerRequest:
      type: object
      required: [fullName, phone]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150 }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        email: { type: string, format: email, maxLength: 255, nullable: true }
        phone: { type: string, pattern: '^(0|\+84)[35789][0-9]{8}$', example: "0900000001" }
        status: { type: string, enum: [ACTIVE], default: ACTIVE }
    UpdateCustomerRequest:
      type: object
      minProperties: 1
      properties:
        fullName: { type: string, minLength: 1, maxLength: 150, nullable: true }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        email: { type: string, format: email, maxLength: 255, description: "Gửi null hoặc chuỗi rỗng để xóa email.", nullable: true }
        phone: { type: string, pattern: '^(0|\+84)[35789][0-9]{8}$', example: "0900000001", nullable: true }
        avtURL: { type: string, maxLength: 2048, nullable: true }
        note: { type: string, maxLength: 1024, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE, null], nullable: true }
    Customer:
      type: object
      required: [id, fullName, gender, dateOfBirth, email, phone, avtURL, note, pets, status]
      properties:
        id: { type: integer, format: int64 }
        fullName: { type: string, minLength: 1, maxLength: 150 }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        email: { type: string, format: email, maxLength: 255, nullable: true }
        phone: { type: string, minLength: 1, maxLength: 30, example: "0900000001" }
        avtURL: { type: string, nullable: true }
        note: { type: string, nullable: true }
        pets: { type: array, items: { $ref: "#/components/schemas/Pet" }, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    CreatePetRequest:
      type: object
      required: [customersId, name, species]
      properties:
        customersId: { type: integer, format: int64, minimum: 1 }
        name: { type: string, minLength: 1, maxLength: 100 }
        species: { $ref: "#/components/schemas/Species" }
        gender: { type: string, enum: [MALE, FEMALE, OTHER, null], nullable: true }
        weight: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 9999.99, nullable: true }
        height: { type: number, minimum: 0, exclusiveMinimum: true, maximum: 9999.99, nullable: true }
        dateOfBirth: { type: string, format: date, nullable: true }
        specialNote: { type: string, nullable: true }
        status: { type: string, enum: [ACTIVE, INACTIVE], default: ACTIVE }
    UpdatePetRequest:
      type: object
      minProperties: 1
      properties:
